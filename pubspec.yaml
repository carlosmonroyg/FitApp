name: fitapp
description: "Rutinas de ejercicio personalizadas por nivel."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.0
  cached_network_image: ^3.4.0
  flutter_body_atlas: ^0.1.4
  flutter_3d_controller: ^2.3.0
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  google_sign_in: ^7.2.0
  cloud_functions: ^6.4.0
  firebase_crashlytics: ^5.4.0
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/data/exercises.json
    - assets/models/
    - assets/icon/icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#0D1117"
  adaptive_icon_foreground: assets/icon/icon_fg.png
  remove_alpha_ios: true
